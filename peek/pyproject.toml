[project]
name = "peek-code"
version = "0.3.0"
description = "The htop for codebases — understand any repo in 5 seconds"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hariom Lohar", email = "hariomlohar.new@gmail.com"}
]
maintainers = [
    {name = "Hariom Lohar", email = "hariomlohar.new@gmail.com"}
]
keywords = ["cli", "tui", "codebase", "visualization", "developer-tools", "textual", "rich", "htop", "code-map", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.80",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/hariomlohardev/peek"
Repository = "https://github.com/hariomlohardev/peek"
Issues = "https://github.com/hariomlohardev/peek/issues"
Changelog = "https://github.com/hariomlohardev/peek/blob/main/CHANGELOG.md"
Documentation = "https://github.com/hariomlohardev/peek#readme"

[project.scripts]
peek = "peek.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["peek"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["peek"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "pyperclip", "Pillow>=10"]
llm = ["openai", "anthropic"]
