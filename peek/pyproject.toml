[project]
name = "peek"
version = "0.1.0"
description = "The htop for codebases â€” understand any repo in 5 seconds"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hariom Lohar", email = "hariomlohar.new@gmail.com"}]
keywords = ["cli", "tui", "codebase", "visualization", "developer-tools", "textual", "rich"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Software Development",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.80",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/hariomlohardev/peek"
Repository = "https://github.com/hariomlohardev/peek"
Issues = "https://github.com/hariomlohardev/peek/issues"

[project.scripts]
peek = "peek.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
