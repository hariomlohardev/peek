<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
  <title>peek — htop for codebases demo</title>
  <rect width="800" height="450" rx="10" fill="#141413"/>
  <rect x="0" y="0" width="800" height="28" fill="#1C1C19"/>
  <rect x="0" y="422" width="800" height="28" fill="#1C1C19"/>
  <circle cx="787" cy="436" r="5" fill="#D4A27F"/>
  <text x="10" y="438" font-family="monospace" font-size="10" fill="#9A9590">q quit  •  / filter  •  --theme dracula  •  --no-tui  •  --html</text>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.2s" begin="0.0s" repeatCount="indefinite" />
    <text x="26" y="20" font-family="monospace" font-size="11" fill="#E8E6E3">peek — htop for codebases</text>
    <rect x="12" y="36" width="776" height="22" rx="6" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="52" font-family="monospace" font-size="12" fill="#D4A27F">peek v0.1.0  •  anthropic-pro  •  10 themes</text>
    <rect x="12" y="64" width="776" height="350" rx="8" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="80" font-family="monospace" font-size="11" fill="#E8E6E3"><tspan x="18" dy="15">  pip install peek &amp;&amp; peek .</tspan><tspan x="18" dy="15">  ─────────────────────────</tspan><tspan x="18" dy="15">  5 seconds → map any repo</tspan><tspan x="18" dy="15">  where to start • what talks to what</tspan><tspan x="18" dy="15"></tspan><tspan x="18" dy="15">  ▶  peek --help  →  peek . --no-tui  →  peek find "auth"</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.2s" begin="2.2s" repeatCount="indefinite" />
    <text x="26" y="20" font-family="monospace" font-size="11" fill="#E8E6E3">peek --help</text>
    <rect x="12" y="36" width="776" height="22" rx="6" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="52" font-family="monospace" font-size="12" fill="#D4A27F">$ peek --help</text>
    <rect x="12" y="64" width="776" height="350" rx="8" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="80" font-family="monospace" font-size="11" fill="#E8E6E3"><tspan x="18" dy="15">  Usage: peek [PATH] [OPTIONS] COMMAND</tspan><tspan x="18" dy="15">  </tspan><tspan x="18" dy="15">  The htop for codebases — understand any repo in 5s.</tspan><tspan x="18" dy="15">  </tspan><tspan x="18" dy="15">  Commands:  scan    scan + stats</tspan><tspan x="18" dy="15">             analyze import graph + ranking</tspan><tspan x="18" dy="15">             find    keyword search</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.2s" begin="4.4s" repeatCount="indefinite" />
    <text x="26" y="20" font-family="monospace" font-size="11" fill="#E8E6E3">peek . --no-tui  (static Rich)</text>
    <rect x="12" y="36" width="776" height="22" rx="6" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="52" font-family="monospace" font-size="12" fill="#D4A27F">$ peek . --no-tui</text>
    <rect x="12" y="64" width="776" height="350" rx="8" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="80" font-family="monospace" font-size="11" fill="#E8E6E3"><tspan x="18" dy="15">  peek  v0.1.0  —  ./peek  (0.12s)</tspan><tspan x="18" dy="15">  ┌ Languages ──────────────────┐ ┌ Tech Stack ────────┐</tspan><tspan x="18" dy="15">  │ Python  ██████████████  68%  │ │ Primary: python  │</tspan><tspan x="18" dy="15">  │ Markdown ░░░░░░░░░░░░░   8%  │ │ Frameworks: textual, rich</tspan><tspan x="18" dy="15">  └─────────────────────────────┘ └────────────────────┘</tspan><tspan x="18" dy="15">  ┌ Start Here ⭐ (ranked) ─────────────────────────┐</tspan><tspan x="18" dy="15">  │ 1  peek/peek/cli.py        9.2  entry • hub     │</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.2s" begin="6.6000000000000005s" repeatCount="indefinite" />
    <text x="26" y="20" font-family="monospace" font-size="11" fill="#E8E6E3">peek find "auth" .</text>
    <rect x="12" y="36" width="776" height="22" rx="6" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="52" font-family="monospace" font-size="12" fill="#D4A27F">$ peek find "auth" .</text>
    <rect x="12" y="64" width="776" height="350" rx="8" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="80" font-family="monospace" font-size="11" fill="#E8E6E3"><tspan x="18" dy="15">  peek find  v0.1.0  —  query: "auth"  (0.04s)</tspan><tspan x="18" dy="15">  ┌ Matches (4 files) ─────────────────────────────┐</tspan><tspan x="18" dy="15">  │ 1  peek/peek/auth.py        8.4  filename     │</tspan><tspan x="18" dy="15">  │ 2  peek/peek/middleware.py  3.1  content:42   │</tspan><tspan x="18" dy="15">  │ 3  tests/test_auth.py       2.8  content:7    │</tspan><tspan x="18" dy="15">  └────────────────────────────────────────────────┘</tspan><tspan x="18" dy="15">  Preview: middleware.py:42  if not auth_ok: raise</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.2s" begin="8.8s" repeatCount="indefinite" />
    <text x="26" y="20" font-family="monospace" font-size="11" fill="#E8E6E3">peek --pack --ask auth | head</text>
    <rect x="12" y="36" width="776" height="22" rx="6" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="52" font-family="monospace" font-size="12" fill="#D4A27F">$ peek --pack --ask "auth" | head -20</text>
    <rect x="12" y="64" width="776" height="350" rx="8" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="80" font-family="monospace" font-size="11" fill="#E8E6E3"><tspan x="18" dy="15">  ── pack: 4 files • ~2.1k tokens • query=auth ──</tspan><tspan x="18" dy="15">  # peek/peek/auth.py</tspan><tspan x="18" dy="15">  def check(token): ...</tspan><tspan x="18" dy="15">  # peek/peek/middleware.py</tspan><tspan x="18" dy="15">  from .auth import check</tspan><tspan x="18" dy="15">  # tests/test_auth.py</tspan><tspan x="18" dy="15">  def test_check(): assert check("x")</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.2s" begin="11.0s" repeatCount="indefinite" />
    <text x="26" y="20" font-family="monospace" font-size="11" fill="#E8E6E3">10 themes  •  peek --theme-list</text>
    <rect x="12" y="36" width="776" height="22" rx="6" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="52" font-family="monospace" font-size="12" fill="#D4A27F">$ peek --theme-list</text>
    <rect x="12" y="64" width="776" height="350" rx="8" fill="#2A2A27" stroke="#3A3936"/>
    <text x="18" y="80" font-family="monospace" font-size="11" fill="#E8E6E3"><tspan x="18" dy="15">  ■ anthropic-pro  Warm editorial      #D4A27F → #141413</tspan><tspan x="18" dy="15">  ■ dracula        Purple haze         #BD93F9 → #282A36</tspan><tspan x="18" dy="15">  ■ nord           Arctic              #88C0D0 → #2E3440</tspan><tspan x="18" dy="15">  ■ tokyo-night    Electric storm      #7AA2F7 → #1A1B26</tspan><tspan x="18" dy="15">  »  PEEK_THEME=dracula peek  •  --theme nord --no-tui</tspan></text>
  </g>
  <rect width="800" height="450" rx="10" fill="none" stroke="#3A3936" stroke-opacity="0.6"/>
</svg>
