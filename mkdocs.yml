site_name: peek — htop for codebases
site_url: https://hariomlohardev.github.io/peek/
site_description: The htop for codebases — understand any repo in 5 seconds
repo_url: https://github.com/hariomlohardev/peek
repo_name: hariomlohardev/peek
docs_dir: .
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: deep-purple
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
nav:
  - Home: docs.md
  - Install: README.md
  - Contributing: peek/CONTRIBUTING.md
  - Research: docs/research/README.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
