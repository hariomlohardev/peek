# Example: post peek's Start Here map as a PR comment.
# Copy into your repo as .github/workflows/peek.yml (requires no token config).
name: peek map

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: peek analyze
        id: peek
        uses: hariomlohardev/peek@v1
        with:
          path: .
      - name: Comment Start Here
        # Fork pull_request tokens cannot write comments; analysis still runs above.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          PEEK_SUMMARY: ${{ steps.peek.outputs.summary }}
          PEEK_START_HERE: ${{ steps.peek.outputs.start_here }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## peek map\n${process.env.PEEK_SUMMARY}\n\n**Start Here**\n${process.env.PEEK_START_HERE}`
            });
