name: Greet PR

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greet:
    if: github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' || github.event.pull_request.author_association == 'FIRST_TIMER'
    runs-on: ubuntu-latest
    steps:
      - name: Welcome contributor
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const body = `Hey @${author}! :wave: Thanks for your first PR to peek! :tada:\n\nWe’ll review within 48h — check \`peek/CONTRIBUTING.md#Quick-Start\`, \`Q&A Discussions\`, and that \`pytest -q\` is green. Your preview: \`peek --no-tui\` screenshot if you touched \`renderer/tui\`. :rocket:`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: body
            });
            core.info(`Greeted @${author} on PR #${pr.number}`);
